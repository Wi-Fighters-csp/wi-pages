<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: 'Poway Symphony Orchestra' }}</title>
    {% if page.description %}
    <meta name="description" content="{{ page.description | escape }}">
    {% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/powayorchestra/home-page.css' | relative_url }}">
  </head>
  <body>
    <div class="pso-foundation pso-game-page">
      {% include powayorchestra/sections/topbar.html %}

      <main class="pso-game-shell">
        {{ content }}
      </main>

      {% include powayorchestra/sections/footer.html %}
    </div>

    <script src="{{ '/assets/js/capstones/powayorchestra/progression.js' | relative_url }}"></script>
    {% include powayorchestra/powayorchestra-capstone-script.html %}
  </body>
</html>
